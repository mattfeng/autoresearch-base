[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-base"
version = "0.1.0"
description = "Generate a read-only Pi autoresearch devcontainer inside an existing repository"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "autoresearch-base contributors" }]
dependencies = ["Jinja2>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
configure-autoresearch = "autoresearch_base.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoresearch_base = ["templates/**/*.j2", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
